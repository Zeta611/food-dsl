[package]
name = "fldsmdfr"
version = "0.1.0"
edition = "2024"

[dependencies]
geo = "0.33.1"
serde = { version = "1.0.229", features = ["derive"] }
tsify = { version = "0.5.8", default-features = false, features = ["js"], optional = true }
wasm-bindgen = { version = "0.2.129", optional = true }

[features]
wasm = ["dep:tsify", "dep:wasm-bindgen"]
